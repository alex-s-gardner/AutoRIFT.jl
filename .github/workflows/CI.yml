name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on a branch, but never on main: those results feed
  # the benchmark history and the coverage trend.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Generous because the one coverage-instrumented job is several times the length of the rest
    # (see the note on `julia-runtest` below), and because the Windows runners vary by more than
    # 20 minutes on identical code. A job hitting this limit means something hung, not that the
    # suite grew.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Named channels rather than version numbers, so there is nothing to bump
        # when a new Julia lands.
        version: ['lts', '1', 'pre']
        os: [ubuntu-latest, macOS-latest, windows-latest]
        exclude:
          # One OS is enough to catch a breaking change on an unreleased Julia;
          # three would triple the cost of the most frequently-broken job.
          - version: 'pre'
            os: macOS-latest
          - version: 'pre'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # The geogrid handoff tests need `ImagePairGeometry`, which is unregistered. `[sources]` in
      # `Project.toml` names where it comes from, and Julia 1.11 and later resolve it from there.
      #
      # Julia 1.10 has no `sources` field in `Pkg.Types.Project`, so it ignores that table, sees an
      # unregistered name in `[extras]`, and refuses to build a test environment at all — the whole
      # suite fails, not just the one testset. Dropping the `[extras]` entry is what lets the rest of
      # the suite run there; `test/runtests.jl` then finds the package absent and skips the handoff
      # testset with a message. Removing this step and the `[extras]` edit is the first thing to do
      # once ImagePairGeometry is registered.
      - name: Drop the unregistered test dependency on Julia LTS
        if: matrix.version == 'lts'
        run: |
          julia -e '
            function strip_entry(path)
                out = String[]
                section = ""
                for line in eachline(path)
                    startswith(line, "[") && (section = strip(line))
                    section == "[extras]" && startswith(line, "ImagePairGeometry ") && continue
                    section == "[targets]" && (line = replace(line, ", \"ImagePairGeometry\"]" => "]"))
                    push!(out, line)
                end
                write(path, join(out, "\n") * "\n")
            end
            strip_entry("Project.toml")'
      - uses: julia-actions/julia-buildpkg@v1
      # Coverage on one job, not all seven, and it is the dominant cost of this workflow:
      # `test/tile.jl` takes 47.5 s uninstrumented and 469.9 s instrumented on 1.12, a 9.9x
      # penalty. Uninstrumented, every Julia version runs the suite in about the same time — the
      # gap that made the 1.12 jobs three times the LTS ones, and had them failing on the job
      # timeout rather than on a test, was this and not the compiler.
      #
      # One Linux job reports what seven did. There are no `Sys.iswindows`-style branches, so a
      # line covered on ubuntu is covered on every OS, and what the other six upload is six copies
      # of one report. `1` rather than `lts` because it runs the whole suite plus the tests that
      # need Julia 1.11 or later, which an LTS-only measurement would report as uncovered.
      #
      # The other six still run the full suite. Only the instrumentation is dropped, so a
      # platform-specific or version-specific *failure* is caught exactly as before.
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@v4
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  load-time:
    # Load time is a tracked cost, not a nicety: the production driver may launch
    # a process per image pair, in which case `using AutoRIFT` plus first-call
    # compilation can exceed the actual correlation. Measured on every PR so a
    # dependency that quietly pulls in a heavy transitive tree is visible at
    # review time rather than discovered in production.
    name: Load time
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Measure
        run: |
          # Precompile first so the measurement is load time, not build time.
          julia --project=. -e 'using AutoRIFT'
          echo "### Load time" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3; do
            /usr/bin/time -f "  using AutoRIFT: %e s" \
              julia --project=. -e 'using AutoRIFT' 2>&1 | tail -1 \
              >> "$GITHUB_STEP_SUMMARY"
          done
          for i in 1 2 3; do
            /usr/bin/time -f "  bare julia:     %e s" \
              julia --project=. -e '1' 2>&1 | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    # Ratio-only gating, both revisions measured in the same job on the same
    # runner. Absolute times from a hosted runner are too noisy to compare across
    # jobs, so an absolute threshold would either fire constantly or never; a
    # ratio between two runs on one machine is meaningful.
    name: Benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2

      - name: Benchmark the merge base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          julia --project=benchmark benchmark/run.jl --tag base

      - name: Benchmark the pull request
        run: |
          git checkout --detach ${{ github.event.pull_request.head.sha }}
          julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
          julia --project=benchmark benchmark/run.jl --tag pr

      - name: Compare
        # `pipefail` is load-bearing, not boilerplate. `compare.jl` signals a regression by
        # `exit(1)`, and a pipeline's status is its *last* command's — so piping into `tee` reported
        # `tee`'s success and swallowed every failure. The job had therefore never once failed a PR
        # on a regression or an allocation: it went green while printing "REGRESSED beyond 1.1x" and
        # "ALLOCATED where none is allowed" into its own summary. The two times it did fail, a
        # harness bug had killed the step outright before the pipe could mask it, which is why the
        # gate looked functional.
        run: |
          set -o pipefail
          {
            echo "### Benchmark: PR vs merge base"
            echo
            julia --project=benchmark benchmark/compare.jl \
              benchmark/results/history/base.json \
              benchmark/results/history/pr.json
          } | tee "$GITHUB_STEP_SUMMARY"
